[project]
name = "qa-toolkit-mcp"
version = "0.1.0"
description = "MCP server for analyzing test run reports. Reads, does not execute."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Gabriel Thomas" }]
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
qa-toolkit-mcp = "qa_toolkit_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qa_toolkit_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
